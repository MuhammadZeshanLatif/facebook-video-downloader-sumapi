<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a6c"/>
      <stop offset="50%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.12)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.04)"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative blobs -->
  <circle cx="150" cy="150" r="200" fill="rgba(37,99,235,0.3)" filter="url(#blur1)"/>
  <circle cx="1050" cy="500" r="250" fill="rgba(6,182,212,0.25)" filter="url(#blur1)"/>
  <circle cx="900" cy="100" r="150" fill="rgba(139,92,246,0.2)" filter="url(#blur1)"/>

  <!-- Decorative grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Center card -->
  <rect x="80" y="80" width="1040" height="470" rx="32" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Download icon circle -->
  <circle cx="600" cy="210" r="72" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <!-- Arrow down icon -->
  <g fill="#ffffff" opacity="0.95">
    <rect x="586" y="160" width="28" height="60" rx="6"/>
    <polygon points="560,216 600,268 640,216"/>
  </g>
  <!-- Download underline -->
  <rect x="566" y="275" width="68" height="6" rx="3" fill="#06B6D4"/>

  <!-- Main heading -->
  <text x="600" y="356" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Facebook Video Downloader</text>

  <!-- Sub heading -->
  <text x="600" y="412" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="rgba(255,255,255,0.75)" text-anchor="middle">Download FB Videos &amp; Reels in HD — Free, Fast &amp; No Login</text>

  <!-- Badge pills -->
  <rect x="290" y="448" width="140" height="38" rx="19" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="360" y="472" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">&#10003; HD Quality</text>

  <rect x="450" y="448" width="140" height="38" rx="19" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="520" y="472" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">&#10003; No Login</text>

  <rect x="610" y="448" width="140" height="38" rx="19" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="680" y="472" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">&#10003; 100% Free</text>

  <rect x="770" y="448" width="150" height="38" rx="19" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="845" y="472" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">&#10003; MP4 Format</text>

  <!-- Domain -->
  <text x="600" y="556" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="rgba(255,255,255,0.5)" text-anchor="middle">fbvideodownloaders.com</text>
</svg>
